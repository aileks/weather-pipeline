weather:
  target: dev
  outputs:
    dev:
      type: duckdb
      # dbt always runs with its working directory inside dbt/ (the Makefile
      # and scripts chdir there, and dagster-dbt does the same), so the
      # default is relative to the project directory; Dagster resolves
      # WEATHER_PIPELINE_DUCKDB_PATH to an absolute path at Definitions load.
      path: "{{ env_var('WEATHER_PIPELINE_DUCKDB_PATH', '../warehouse/weather.duckdb') }}"
      threads: 1
