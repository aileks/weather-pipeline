[project]
name = "weather-pipeline"
version = "0.1.0"
description = "Hourly weather observations from Open-Meteo into DuckDB via Dagster and dbt"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster~=1.13",
    "dagster-dbt~=0.29",
    "dagster-duckdb~=0.29",
    "dagster-webserver>=1.13.18",
    "dbt-core~=1.11.0",
    "dbt-duckdb~=1.11.0",
    "duckdb>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["weather_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.dagster]
module_name = "weather_pipeline.definitions"
